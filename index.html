<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Horizon Rush</title>
<meta name="description" content="Horizon Rush – Arcade-Rennspiel und Party-Spiel für bis zu 8 Spieler im Browser.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Horizon Rush">
<meta name="theme-color" content="#0f142d">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>
<div id="menu" hidden></div>
<div id="toast" hidden></div>
<div id="rotate"><div><b>Bitte quer halten</b><span>Horizon Rush wird im Querformat gespielt.</span></div></div>
<noscript><p class="noscript">Horizon Rush braucht JavaScript.</p></noscript>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" async></script>
<script src="js/qrcode.js" defer></script>
<script>
// Grafikstil wählen (Einstellungen → Grafikstil) und die passenden Skripte laden.
// Neon ersetzt nur Zeichen-Code; Spiellogik und Netzwerk sind in beiden Stilen gleich, daher können Spieler mit
// unterschiedlichen Stilen zusammen spielen.
(function () {
  var t = 'classic';
  try { if (localStorage.getItem('hr_theme') === 'neon') t = 'neon'; } catch (e) { }
  window.HR_THEME = t;
  var neon = t === 'neon', w = function (h) { document.write(h); };
  if (neon) { document.querySelector('link[rel=stylesheet]').href = 'style-neon.css'; document.querySelector('meta[name=theme-color]').content = '#07060f'; }
  var files = ['core', 'audio', 'input', 'render', 'race', 'net', 'main', 'party', 'partyrace', 'arena', 'style', 'games/lightcycle', 'games/tanks', 'games/sumo', 'games/minirace', 'games/clouds', 'games/tunnel', 'games/pong', 'games/crossing', 'games/floor', 'games/laser', 'games/crates', 'games/crown', 'games/snow', 'games/memory', 'games/redlight', 'games/treasure', 'games/quickdraw', 'games/balloon', 'games/dark', 'games/coins', 'games/parkour', 'showcase'];
  var swap = { render: 1, style: 1 }, patch = { core: 1, partyrace: 1, arena: 1 };
  files.forEach(function (f) {
    if (neon && f === 'showcase') w('<script src="js/neon/games-patch.js" defer><\/script>');
    w('<script src="js/' + (neon && swap[f] ? 'neon/' : '') + f + '.js" defer><\/script>');
    if (neon && patch[f]) w('<script src="js/neon/' + f + '-patch.js" defer><\/script>');
  });
})();
</script>
</body>
</html>
